//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.


// Custom definitions may go here

// Include common definitions from above.

apply plugin: 'jacoco'
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

jacoco {
    toolVersion = '0.8.12'
}

android {
    namespace = 'org.firstinspires.ftc.teamcode'
    packagingOptions { jniLibs.useLegacyPackaging true }
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all {
            jacoco {
                includeNoLocationClasses = true
                excludes = ['jdk.internal.*']
            }
        }
    }
}

repositories {
    maven { url = 'https://www.matthewo.tech/maven/' }
    maven { url = 'https://maven.brott.dev/' }
    maven { url = 'https://maven.pedropathing.com' }
    maven { url = 'https://mymaven.bylazar.com/releases' }
    maven { url = 'https://repo.dairy.foundation/releases' }
    maven { url = 'https://repo.dairy.foundation/snapshots' }
}

dependencies {
    implementation project(':FtcRobotController')
    annotationProcessor files('lib/OpModeAnnotationProcessor.jar')

    // SolversLib
    implementation 'org.solverslib:core:0.3.4'
    implementation 'org.solverslib:pedroPathing:0.3.4'

    // Pedro Pathing
    implementation 'com.pedropathing:ftc:2.1.2'
    implementation 'com.pedropathing:telemetry:1.0.0'

    // Panels Dashboard
    implementation 'com.bylazar:fullpanels:1.0.12'

    // Unit Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testRuntimeOnly 'org.mockito:mockito-core:5.23.0'
}

tasks.withType(Test).configureEach {
    doFirst {
        def agent = classpath.files.find { it.name.contains('mockito-agent') }
        if (agent) {
            jvmArgs "-javaagent:${agent.absolutePath}"
        }
    }
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'

    def excludes = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*$Lambda$*.*',
        '**/*$$ExternalSynthetic*.*',
        '**/*$inlined$*.*',
        'org/firstinspires/ftc/teamcode/adaptations/**'
    ]

    def javaClasses = fileTree(
        dir: layout.buildDirectory.dir('intermediates/javac/debug/compileDebugJavaWithJavac/classes').get().asFile,
        excludes: excludes
    )
    def kotlinClasses = fileTree(
        dir: layout.buildDirectory.dir('tmp/kotlin-classes/debug').get().asFile,
        excludes: excludes
    )

    classDirectories.setFrom(files(javaClasses, kotlinClasses))
    sourceDirectories.setFrom(files('src/main/java', 'src/main/kotlin'))
    additionalSourceDirs.setFrom(files('src/main/java', 'src/main/kotlin'))
    executionData.setFrom(fileTree(dir: layout.buildDirectory.get().asFile, includes: [
        'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec',
        'jacoco/testDebugUnitTest.exec',
        'jacoco/test.exec',
        '**/*.ec',
        '**/*.exec'
    ]))

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}
